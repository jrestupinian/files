# reload config file
bind r source-file ~/.tmux.conf

# Set prefix to Ctrl-a
# unbind C-b
# set-option -g prefix C-a
# bind-key C-a send-prefix

set -g xterm-keys on

# switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Enable mouse control (clickable windows, panes, resizable panes)
set -g mouse on

bind -n M-w run -b "tmux show-buffer | clip.exe"

bind-key -n MouseDown3Pane paste-buffer


# Enable 256 color support
set -g default-terminal "screen-256color"

# Enable true color support
set-option -ga terminal-overrides ",xterm-256color:Tc"

set-option -g default-command bash


# Set clock mode style
setw -g clock-mode-colour colour64
setw -g clock-mode-style 24


# DESIGN TWEAKS

# don't do anything when a 'bell' rings
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# clock mode
setw -g clock-mode-colour colour117

# copy mode
setw -g mode-style 'fg=colour233 bg=colour75 bold'

# panes
set -g pane-border-style 'fg=colour67'
set -g pane-active-border-style 'fg=colour117'

# statusbar
set -g status-position bottom
set -g status-justify left
set -g status-style 'fg=colour75'
set -g status-left ''
set -g status-left-length 10
set -g status-right-style 'fg=colour233 bg=colour117'
set -g status-right '%Y-%m-%d %H:%M '
set -g status-right-length 50

setw -g window-status-current-style 'fg=colour233 bg=colour75'
setw -g window-status-current-format ' #I #W #F '

setw -g window-status-style 'fg=colour75 bg=colour233'
setw -g window-status-format ' #I #[fg=colour250]#W #[fg=colour117]#F '

setw -g window-status-bell-style 'fg=colour117 bg=colour75 bold'

# messages
set -g message-style 'fg=colour117 bg=colour75 bold'

set-option -sg escape-time 10

# Split the window into your desired layout
# bind m split-window -h -p 35 \; split-window -v -p 35 \; select-pane -L
# Bind 'T' (for Time/Template) to create the layout with a clock
# bind m split-window -h -p 40 \; split-window -v -p 15 \; clock-mode \; select-pane -L
bind m split-window -v -p 15 \; select-pane -U \; split-window -h -p 40 \; select-pane -L

